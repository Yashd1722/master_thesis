augmentation:
  both_sided: false
  enabled: true
  min_visible: 15
  normalize: true
  pad_max_frac: 0.97
  tsc_copies: 3
datasets:
  ts_1500:
    class_names:
    - fold
    - hopf
    - transcritical
    - 'null'
    num_classes: 4
    path_key: ts_1500
    test_frac: 0.01
    train_frac: 0.95
    ts_length: 1500
    val_frac: 0.04
  ts_500:
    class_names:
    - fold
    - hopf
    - transcritical
    - 'null'
    num_classes: 4
    path_key: ts_500
    test_frac: 0.01
    train_frac: 0.95
    ts_length: 500
    val_frac: 0.04
inference:
  n_null_series: 10
  null_method: AR1
  prediction_steps: 40
  pad_mode: "zero"
  rolling_window_frac: 0.25
  rolling_window_frac_augment: 0.25
  use_4channel: true
models:
  dl:
  - cnn_lstm
  - lstm
  - inceptiontime
  - patchtst
  - resnet
  - tcn
  - rnn_fcn
  tsc:
  - minirocket
  - multirocket
  - arsenal
  - rdst
  - weasel2
  - drcif
  - rocket
  - tsf
  - st
  - ls
  - boss
  - bop
  - saxvsm
  - tsbf
  - lps
  - fastshapelet
  - catch22
  - tde
  - pf
  - cif
  - mrsqm
  - grsf
naming:
  checkpoint_dl: '{model}_{dataset}_v{variant}_best.ckpt'
  checkpoint_tsc: '{model}_{dataset}_best.pkl'
  experiment_dir: '{model}_{dataset}_{metric}'
  result_file: result.json
