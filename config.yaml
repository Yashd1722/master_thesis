project:
  author: Yash Dhameliya
  name: early_warning_signals_thesis
  seed: 42
training:
  arsenal:
    max_train_samples: 30000
    num_kernels: 2000
  cnn_lstm:
    batch_size: 256
    epochs: 1500
    grad_clip: 1.0
    lr: 0.0005
    min_lr: 1.0e-06
    optimizer: adam
    pad_variants:
    - 1
    - 2
    patience: 50
    scheduler: reduce_on_plateau
    scheduler_factor: 0.5
    scheduler_patience: 20
    weight_decay: 0.0
  drcif:
    max_train_samples: 20000
    n_estimators: 100
  inceptiontime:
    batch_size: 256
    epochs: 500
    grad_clip: 1.0
    lr: 0.001
    min_lr: 1.0e-06
    optimizer: adam
    pad_variants:
    - 1
    patience: 30
    scheduler: reduce_on_plateau
    scheduler_factor: 0.5
    scheduler_patience: 10
    weight_decay: 0.0001
  lstm:
    batch_size: 128
    epochs: 300
    grad_clip: 1.0
    lr: 0.001
    min_lr: 1.0e-06
    optimizer: adam
    pad_variants:
    - 1
    patience: 20
    scheduler: none
    weight_decay: 0.0
  minirocket:
    max_train_samples: 80000
    n_kernels: 10000
  multirocket:
    max_train_samples: 30000
    n_kernels: 6250
  rdst:
    max_shapelets: 10000
    max_train_samples: 30000
  rocket:
    max_train_samples: 40000
    n_kernels: 10000
  weasel2:
    max_train_samples: 20000
