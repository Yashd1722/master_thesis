  ts_1500: dataset/ts_1500/
  ts_500: dataset/ts_500/
project:
  author: Yash Dhameliya
  name: early_warning_signals_thesis
  seed: 42
training:
  arsenal:
    max_train_samples: 30000
    num_kernels: 2000
  cnn_lstm:
    batch_size: 256
    epochs: 1500
    grad_clip: 1.0
    lr: 0.0005
    min_lr: 1.0e-06
    optimizer: adam
    pad_variants:
    - 1
    - 2
    patience: 50
    scheduler: reduce_on_plateau
    scheduler_factor: 0.5
    scheduler_patience: 20
    weight_decay: 0.0
  drcif:
    max_train_samples: 8000
    n_estimators: 50
  inceptiontime:
    batch_size: 256
    epochs: 500
    grad_clip: 1.0
    lr: 0.001
    min_lr: 1.0e-06
    optimizer: adam
    pad_variants:
    - 1
    patience: 30
    scheduler: reduce_on_plateau
    scheduler_factor: 0.5
    scheduler_patience: 10
    weight_decay: 0.0001
  lstm:
    batch_size: 128
    epochs: 300
    grad_clip: 1.0
    lr: 0.001
    min_lr: 1.0e-06
    optimizer: adam
    pad_variants:
    - 1
    patience: 20
    scheduler: none
    weight_decay: 0.0
  patchtst:
    batch_size: 128
    epochs: 300
    grad_clip: 1.0
    lr: 0.001
    min_lr: 1.0e-06
    optimizer: adam
    pad_variants:
    - 1
    patience: 20
    scheduler: reduce_on_plateau
    scheduler_factor: 0.5
    scheduler_patience: 10
    weight_decay: 0.0001
  resnet:
    batch_size: 128
    epochs: 500
    grad_clip: 1.0
    lr: 0.001
    min_lr: 1.0e-06
    optimizer: adam
    pad_variants:
    - 1
    patience: 40
    scheduler: reduce_on_plateau
    scheduler_factor: 0.5
    scheduler_patience: 15
    weight_decay: 0.0001
  tcn:
    batch_size: 128
    epochs: 400
    grad_clip: 0.4
    lr: 0.002
    min_lr: 1.0e-06
    optimizer: adam
    pad_variants:
    - 1
    patience: 30
    scheduler: reduce_on_plateau
    scheduler_factor: 0.5
    scheduler_patience: 12
    weight_decay: 0.0
  rnn_fcn:
    batch_size: 128
    epochs: 500
    grad_clip: 1.0
    lr: 0.001
    min_lr: 1.0e-06
    optimizer: adam
    pad_variants:
    - 1
    patience: 40
    scheduler: reduce_on_plateau
    scheduler_factor: 0.5
    scheduler_patience: 15
    weight_decay: 0.0001
  minirocket:
    max_train_samples: 80000
    n_kernels: 10000
  multirocket:
    max_train_samples: 30000
    n_kernels: 6250
  rdst:
    max_shapelets: 10000
    max_train_samples: 30000
  rocket:
    max_train_samples: 40000
    n_kernels: 10000
  weasel2:
    max_train_samples: 20000
  catch22:
    max_train_samples: 30000
    n_estimators: 200
  tde:
    max_train_samples: 5000
    n_parameter_samples: 100
  pf:
    max_train_samples: 2000
    n_estimators: 30

  # --- Bake Off baselines (see models/tsc.py TSC_SPECS for why these five and
  # not the elastic-distance/EE baselines). No max_train_samples: these train
  # on the full split, bounded by time_limit_in_minutes instead. Unmeasured —
  # tune from the first real run.
  tsf:
    n_estimators: 200
    time_limit_in_minutes: 60
    contract_max_n_estimators: 500
    max_train_samples: 30000
  st:
    n_shapelet_samples: 300
    time_limit_in_minutes: 0
    max_train_samples: 20000
  ls:
    max_iter: 100
    batch_size: 256
    max_train_samples: 20000
  boss:
    time_limit_in_minutes: 90
    max_ensemble_size: 50
    n_parameter_samples: 50
    max_train_samples: 5000
  bop:
    window_size: 0.05
    word_size: 0.5
    n_bins: 4
    n_neighbors: 1
    fit_sample_size: 2000
    chunk_size: 500
    max_train_samples: 30000
  saxvsm:
    window_size: 0.05
    word_size: 0.5
    n_bins: 8
    fit_sample_size: 2000
    chunk_size: 500
    max_train_samples: 30000
  tsbf:
    n_bins: 10
    n_estimators: 200
    min_interval_length: 5
    n_subseries: 20
    max_fit_pool: 200000
    rf_max_leaf_nodes: 500
    max_train_samples: 30000
  lps:
    n_trees: 200
    n_segments: 75
    min_segment_length: 5
    max_leaf_nodes: 100
    max_pool_size: 20000
    chunk_size: 20000
    clf_max_leaf_nodes: 500
    max_fit_pool: 200000
    max_train_samples: 30000
  fastshapelet:
    n_shapelets: 10
    max_candidates: 200
    sax_word_length: 8
    sax_alphabet_size: 4
    selection_sample_size: 500
    clf_max_leaf_nodes: 500
    max_fit_pool: 200000
    max_train_samples: 30000
  cif:
    n_estimators: 100
    max_train_samples: 10000
  mrsqm:
    max_train_samples: 20000
  grsf:
    n_estimators: 100
    n_shapelets: log2
    max_train_samples: 8000
