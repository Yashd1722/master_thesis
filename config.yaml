augmentation:
  both_sided: false
  enabled: true
  min_visible: 30
  normalize: true
  pad_max_frac: 0.9
  tsc_copies: 3
datasets:
  ts_1500:
    class_names:
    - fold
    - hopf
    - transcritical
    - 'null'
    num_classes: 4
    path_key: ts_1500
    test_frac: 0.01
    train_frac: 0.95
    ts_length: 1500
    val_frac: 0.04
  ts_500:
    class_names:
    - fold
    - hopf
    - transcritical
    - 'null'
    num_classes: 4
    path_key: ts_500
    test_frac: 0.01
    train_frac: 0.95
    ts_length: 500
    val_frac: 0.04
inference:
  ar1_fit_fraction: 0.2
  end_frac: 1.0
  n_null_series: 10
  null_method: AR1
  prediction_steps: 40
  roc_start_frac:
    64PE406E1: 0.6
    MS21: 0.6
    MS66: 0.6
    default: 0.6
  rolling_window_frac: 0.25
  rolling_window_frac_augment: 0.25
  use_4channel: true
models:
  dl:
  - cnn_lstm
  - lstm
  - inceptiontime
  tsc:
  - minirocket
  - multirocket
  - arsenal
  - rdst
  - weasel2
  - drcif
  - rocket
naming:
  checkpoint_dl: '{model}_{dataset}_v{variant}_best.ckpt'
  checkpoint_tsc: '{model}_{dataset}_best.pkl'
  experiment_dir: '{model}_{dataset}_{metric}'
  result_file: result.json
